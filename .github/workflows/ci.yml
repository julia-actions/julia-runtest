name: CI

on:
  push:
    branches:
      - "main"
      - "master"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.0"
          - "lts"
          - "1" # automatically expands to the latest stable 1.x release of Julia
          - "pre"
          - "nightly"
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - x64
          - x86
          - aarch64
        # 32-bit Julia binaries are not available on macOS
        # macOS runners use Apple Silicon (ARM64)
        exclude:
          - os: macOS-latest
            arch: x86
          - os: macOS-latest
            arch: x64
          - os: ubuntu-latest
            arch: aarch64
          - os: windows-latest
            arch: aarch64
          # Julia 1.0 didn't support ARM64
          - os: macOS-latest
            arch: aarch64
            version: "1.0"

    steps:
      - name: Checkout Example.jl
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: julia-actions/Example.jl

      - name: Verify that test output file does not exist yet
        run: test ! -f "$HOME/julia-runtest"
        shell: bash

      - name: Checkout julia-runtest
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: ./.github/actions/julia-runtest

      - uses: julia-actions/setup-julia@5c9647d97b78a5debe5164e9eec09d653d29bd71 # v2.6.1
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - uses: julia-actions/cache@b7788abd52452d5bc033d69796e110d9906af4ab # v3.2.0

      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0

      - uses: ./.github/actions/julia-runtest

      - uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail-ci-if-error: true


      - name: Verify that test output file exists
        run: test -f "$HOME/julia-runtest"
        shell: bash
