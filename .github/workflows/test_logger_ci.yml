name: TestLogger CI

on:
  push:
    branches:
      - "main"
      - "master"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.6"
          - "lts"
          - "1" # automatically expands to the latest stable 1.x release of Julia
          - "pre"
          - "nightly"
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - x64
          - x86
          - aarch64
        # 32-bit Julia binaries are not available on macOS
        # macOS runners use Apple Silicon (ARM64)
        exclude:
          - os: macOS-latest
            arch: x86
          - os: macOS-latest
            arch: x64
          - os: ubuntu-latest
            arch: aarch64
          - os: windows-latest
            arch: aarch64
          # Julia 1.6 didn't support ARM64
          - os: macOS-latest
            arch: aarch64
            version: "1.6"

    steps:
      - name: Checkout julia-runtest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - uses: julia-actions/cache@b7788abd52452d5bc033d69796e110d9906af4ab # v3.2.0

      - run: julia --color=yes --check-bounds=yes test_logger_tests.jl
